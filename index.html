<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One More Mushroom</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id = "start">
    <img  id="start-img" src="assets/img/start.png" alt="One More Mushroom">
    <button id="start-btn"></button>
  </div>
  <div id="game-div">
    <canvas id="game"></canvas>
    <div id = "inventory">
      <div class="mush">
        <img id="cep" src="assets/img/mushrooms/cep.png" alt="Cep">
        <p id="cep_counter"></p>
      </div>
      <div class="mush">
        <img id="ouDeReig" src="assets/img/mushrooms/ouDeReig.png" alt="Ou de Reig">
        <p id="ouDeReig_counter"></p>
      </div>
      <div class="mush">
        <img id="rossinyols" src="assets/img/mushrooms/rossinyols.png" alt="Rossinyols">
        <p id="rossinyols_counter"></p>
      </div>
      <div class="mush">
        <img id="rovello" src="assets/img/mushrooms/rovello.png" alt="Rovelló">
        <p id="rovello_counter"></p>
      </div>
      <div class="mush">
        <img id="trompeta" src="assets/img/mushrooms/trompeta.png" alt="Trompeta">
        <p id="trompeta_counter"></p> 
      </div>  
    </div>
    <div id="gameplay">
      <button id="recolect"></button>
      <div id="movement">
        <button id="up"></button>
        <button id="right"></button>
        <button id="down"></button>
        <button id="left"></button>
      </div>
    </div>
  </div>
  
  
  <div id = "gameOver">
    <img  id="gameOver-img" src="assets/img/gameover.png" alt="Game Over!">
    <button id="playAgain-btn-gameover"></button>
  </div>
  
  <div id = "victory">
    <img  id="victory-img" src="assets/img/win.png" alt="You Win!">
    <button id="playAgain-btn-victory"></button>
  </div>
  
  <script src="assets/js/constants.js"></script>
  <script src="assets/js/models/bg.js"></script>
  <script src="assets/js/models/obstacles.js"></script>
  <script src="assets/js/models/mushrooms.js"></script>
  <script src="assets/js/models/sprites.js"></script>
  <script src="assets/js/models/player.js"></script>
  <script src="assets/js/models/game.js"></script>
  <script src="assets/js/index.js"></script>
</body>
</html>
